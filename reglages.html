<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CD Tir 34 — Réglage des tarifs</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f6f7fb;--txt:#0f1222;--muted:#55607a;--line:#e8ecf3;--brand:#0077b6;--brand2:#00b4d8;--soft:#e0f4ff}
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--txt)}
  .wrap{max-width:760px;margin:32px auto;padding:0 20px}
  .hero{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:22px;padding:22px 26px;box-shadow:0 20px 50px rgba(0,119,182,.18)}
  .hero img{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:14px;padding:8px}
  .hero h1{margin:0;font-size:21px}
  .hero p{margin:6px 0 0;opacity:.92;font-size:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(16,24,40,.08);margin-top:18px;overflow:hidden}
  .card h2{margin:0;font-size:15px;padding:14px 20px;background:linear-gradient(180deg,rgba(0,119,182,.12),rgba(0,119,182,.04));border-bottom:1px solid var(--line)}
  .body{padding:18px 20px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
  @media(max-width:620px){.row{grid-template-columns:1fr}}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .in{position:relative}
  .in span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;font-weight:600}
  input{width:100%;padding:11px 44px 11px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;outline:none}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(0,119,182,.15)}
  input.changed{background:#fff8e1;border-color:#f0c040}
  .was{font-size:11.5px;color:var(--muted);margin-top:4px}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
  button,a.btn{border:none;border-radius:12px;padding:13px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none}
  .primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
  .light{background:#fff;color:var(--txt);border:1.5px solid var(--line)!important}
  .steps{background:var(--soft);border:1.5px solid rgba(0,119,182,.25);border-radius:14px;padding:16px 20px;font-size:14px;line-height:1.65}
  .steps ol{margin:6px 0 0;padding-left:20px}
  .steps code{background:#fff;padding:1px 6px;border-radius:6px;font-weight:700}
  .ok{display:none;margin-top:14px;padding:12px 16px;border-radius:12px;background:#e8f8ef;border:1.5px solid #8fd6ab;color:#14532d;font-weight:600;font-size:14px}
  .err{display:none;margin-top:14px;padding:12px 16px;border-radius:12px;background:#fef2f2;border:1.5px solid #fca5a5;color:#991b1b;font-weight:600;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:11px 4px;border-bottom:1px solid var(--line)}
  td.v{text-align:right;font-weight:800;color:var(--brand);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  .src{font-size:12.5px;margin-top:10px;font-weight:600}
  .lock{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .lock > div{flex:1;min-width:200px}
  input[type=password], input.txt{padding-right:13px}
  fieldset{border:0;padding:0;margin:0}
  fieldset:disabled input{background:#f3f5f9;color:#55607a}
  .info{font-size:12.5px;color:var(--muted);margin-top:8px}
  button:disabled{opacity:.55;cursor:not-allowed}
</style>
<script src="tarifs.js"></script>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <img src="logo_34.jpg" alt="CD Tir 34">
    <div>
      <h1>Réglage des tarifs</h1>
      <p>Modifiez les montants puis enregistrez : les 4 formulaires sont mis à jour aussitôt.</p>
    </div>
  </header>

  <div class="card">
    <h2>🔒 Accès</h2>
    <div class="body">
      <div class="lock">
        <div><label>Mot de passe</label><input id="pwd" type="password" autocomplete="current-password" placeholder="Mot de passe du comité"></div>
        <div><label>Votre nom (pour l'historique)</label><input id="nom" class="txt" type="text" placeholder="Ex : J. Dupont"></div>
      </div>
      <div class="info" id="src">Lecture des tarifs en cours…</div>
    </div>
  </div>

  <fieldset id="fs" disabled>
  <div class="card">
    <h2>🚗 Formulaires Arbitre / Comité / Divers</h2>
    <div class="body">
      <div class="row">
        <div><label>Taux kilométrique</label><div class="in"><input id="km" type="number" step="0.01" min="0"><span>€/km</span></div><div class="was" id="w_km"></div></div>
        <div><label>Ville du « Fait à … » (PDF)</label><input id="fait_a" class="txt" type="text"><div class="was" id="w_fait_a"></div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🏟️ Formulaire Club (organisation compétition départementale)</h2>
    <div class="body">
      <div class="row">
        <div><label>Par journée d'organisation</label><div class="in"><input id="club_journee" type="number" step="0.01" min="0"><span>€</span></div><div class="was" id="w_club_journee"></div></div>
        <div><label>Par tir</label><div class="in"><input id="club_tir" type="number" step="0.01" min="0"><span>€</span></div><div class="was" id="w_club_tir"></div></div>
      </div>
      <div class="row">
        <div><label>Par repas arbitre</label><div class="in"><input id="club_repas" type="number" step="0.01" min="0"><span>€</span></div><div class="was" id="w_club_repas"></div></div>
        <div><label>Forfait moment de convivialité</label><div class="in"><input id="club_convivialite" type="number" step="0.01" min="0"><span>€</span></div><div class="was" id="w_club_convivialite"></div></div>
      </div>
    </div>
  </div>
  </fieldset>

  <div class="actions">
    <button class="primary" id="btnSave" type="button" disabled>💾 Enregistrer les tarifs</button>
    <button class="light" id="btnReset" type="button">↺ Annuler mes changements</button>
    <a class="btn light" href="index.html">← Accueil</a>
  </div>
  <div class="ok" id="ok"></div>
  <div class="err" id="err"></div>
</div>

<script>
  const KEYS = ["km","fait_a","club_journee","club_tir","club_repas","club_convivialite"];
  const $ = id => document.getElementById(id);
  const fr = v => typeof v === "number" ? v.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}) : v;
  let CUR = {};
  const online = /^https:\/\/script\.google\.com\//.test(window.TARIFS_API || "");

  function show(id, msg){ ["ok","err"].forEach(x => $(x).style.display = "none"); if(msg){ $(id).innerHTML = msg; $(id).style.display = "block"; } }

  function fill(t){
    CUR = Object.assign({}, t);
    KEYS.forEach(k => {
      $(k).value = CUR[k];
      $(k).classList.remove("changed");
      $("w_"+k).textContent = "En vigueur : " + fr(CUR[k]) + (k==="km" ? " €/km" : k==="fait_a" ? "" : " €");
    });
  }
  function changed(){ return KEYS.some(k => String($(k).value).replace(",",".") !== String(CUR[k])); }
  function refreshBtn(){ $("btnSave").disabled = !online || !$("pwd").value || !changed(); }

  KEYS.forEach(k => $(k).addEventListener("input", () => {
    $(k).classList.toggle("changed", String($(k).value).replace(",",".") !== String(CUR[k]));
    refreshBtn();
  }));
  $("pwd").addEventListener("input", () => { $("fs").disabled = !online || !$("pwd").value; refreshBtn(); });
  $("btnReset").addEventListener("click", () => { fill(CUR); show(); refreshBtn(); });

  $("btnSave").addEventListener("click", async () => {
    show();
    const tarifs = {};
    for (const k of KEYS){
      if (k === "fait_a"){
        const v = $(k).value.trim();
        if (!v) return show("err","Merci d'indiquer la ville du « Fait à ».");
        tarifs[k] = v; continue;
      }
      const x = Number(String($(k).value).replace(",", "."));
      if ($(k).value === "" || !Number.isFinite(x) || x < 0){ $(k).focus(); return show("err","Montant invalide : merci de vérifier les champs surlignés."); }
      tarifs[k] = Math.round(x*100)/100;
    }
    $("btnSave").disabled = true; $("btnSave").textContent = "⏳ Enregistrement…";
    try{
      const r = await fetch(window.TARIFS_API, { method:"POST", body: JSON.stringify({ motDePasse: $("pwd").value, nom: $("nom").value, tarifs }) });
      const d = await r.json();
      if (!d.ok) throw new Error(d.erreur || "Erreur inconnue");
      window.TARIFS_APPLY(d.tarifs); fill(window.TARIFS);
      $("src").textContent = "✅ Tarifs à jour" + (d.maj ? " (dernière modification le " + d.maj + ")" : "") + ".";
      show("ok", d.nbChangements ? "✅ Tarifs enregistrés. Les formulaires utilisent les nouveaux montants dès leur prochaine ouverture." : "Aucun changement à enregistrer.");
    }catch(e){
      show("err", "❌ " + (e.message === "Failed to fetch" ? "Impossible de joindre Google. Vérifiez la connexion internet." : e.message));
    }finally{
      $("btnSave").textContent = "💾 Enregistrer les tarifs"; refreshBtn();
    }
  });

  window.TARIFS_READY.then(T => {
    fill(T);
    if (!online){
      $("src").innerHTML = "⚠️ Le site n'est pas encore relié au script Google : enregistrement impossible pour l'instant.";
      $("src").style.color = "#991b1b";
    } else if (window.TARIFS_SOURCE === "google"){
      $("src").textContent = "✅ Tarifs à jour" + (window.TARIFS_MAJ ? " (dernière modification le " + window.TARIFS_MAJ + ")" : "") + ". Saisissez le mot de passe pour les modifier.";
      $("src").style.color = "#14532d";
    } else {
      $("src").textContent = "⚠️ Google injoignable : les montants affichés sont les tarifs de secours. Réessayez plus tard.";
      $("src").style.color = "#991b1b";
    }
  });
</script>
</body>
</html>
